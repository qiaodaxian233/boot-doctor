name: windows-test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write          # 只用于把界面截图推到 ci-shots 分支
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离屏自测
        run: python .github/ci_annotate.py tests python _test_boot.py
      - name: 体检分段计时
        if: always()
        run: python .github/ci_annotate.py profile python _prof_detail.py
      - name: 界面截图
        if: always() && github.event_name == 'push'
        env:
          QT_QPA_FONTDIR: "C:/Windows/Fonts"   # 离屏平台默认不带字体库，不指一下截出来全是空白
        run: python .github/ci_annotate.py shots python _ui_pages_shot.py
      - name: 截图推到 ci-shots 分支（每次覆盖，只留最新一次）
        if: always() && github.event_name == 'push'
        continue-on-error: true      # 截图只是辅助：几个分支同时推会撞车，不该让整个检查变红
        shell: bash
        run: |
          [ -d _ci_shots ] || exit 0
          cd _ci_shots
          echo "${GITHUB_REF_NAME} @ ${GITHUB_SHA}" > SOURCE.txt
          git init -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "界面截图：${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          for i in 1 2 3 4; do
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots && exit 0
            echo "推送失败（第 $i 次），随机等几秒重试"; sleep $((RANDOM % 6 + 2))
          done
          echo "::warning::截图没推上去（多个分支同时推送撞车），不影响测试结果"
